<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BreathSafe Aura</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:linear-gradient(135deg,#fdf2f8,#e0f2fe);
color:#1e293b;
}

.header{
text-align:center;
padding:30px;
font-size:28px;
font-weight:700;
color:#db2777;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.7);
backdrop-filter:blur(15px);
border-radius:25px;
padding:25px;
margin-bottom:25px;
box-shadow:0 15px 35px rgba(0,0,0,0.1);
}

.controls{
display:flex;
gap:15px;
margin-bottom:20px;
}

select,button{
padding:10px 15px;
border-radius:20px;
border:none;
}

button{
background:#db2777;
color:white;
cursor:pointer;
}

.grid{
display:grid;
gap:20px;
}

.grid-4{
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}

.aqi{
font-size:70px;
font-weight:700;
color:#be185d;
}

ul{margin-top:10px;padding-left:20px;}
li{margin-bottom:6px;}
</style>
</head>

<body>

<div class="header">
🌸 BreathSafe Aura – Air Quality & Health Care
</div>

<div class="container">

<div class="controls">
<select id="city"></select>
<select id="condition">
<option>Asthma</option>
<option>COPD</option>
<option>Bronchitis</option>
<option>Allergic Rhinitis</option>
</select>
<button onclick="analyze()">Check AQI</button>
</div>

<div class="card">
<h3>Air Quality Index</h3>
<div id="aqi" class="aqi">--</div>
<p id="status"></p>
<p id="updated"></p>
</div>

<div class="grid grid-4">
<div class="card"><h4>PM2.5</h4><p id="pm25"></p></div>
<div class="card"><h4>PM10</h4><p id="pm10"></p></div>
<div class="card"><h4>CO</h4><p id="co"></p></div>
<div class="card"><h4>NO₂</h4><p id="no2"></p></div>
</div>

<div class="card">
<h3>Next 24 Hours AQI Prediction</h3>
<canvas id="aqiChart"></canvas>
</div>

<div class="card">
<h3>Precautionary Measures</h3>
<ul id="precautions"></ul>
</div>

<div class="card">
<h3>Nearby Hospitals</h3>
<ul id="hospitals"></ul>
</div>

</div>

<script>
const districts=[
"Bagalkote","Ballari","Belagavi","Bengaluru Urban","Bengaluru Rural",
"Bidar","Chamarajanagar","Chikkaballapura","Chikkamagaluru",
"Chitradurga","Dakshina Kannada","Davanagere","Dharwad","Gadag",
"Hassan","Haveri","Kalaburagi","Kodagu","Kolar","Koppal","Mandya",
"Mysuru","Raichur","Ramanagara","Shivamogga","Tumakuru","Udupi",
"Uttara Kannada","Vijayanagara","Vijayapura","Yadgir"
];

districts.forEach(d=>{
let opt=document.createElement("option");
opt.text=d;
city.add(opt);
});

let chart;

function createChart(data){
const ctx=document.getElementById("aqiChart").getContext("2d");
if(chart){chart.destroy();}
chart=new Chart(ctx,{
type:"line",
data:{
labels:["1AM","4AM","7AM","10AM","1PM","4PM","7PM","10PM"],
datasets:[
{label:"AQI",data:data,borderColor:"#db2777",fill:false},
{label:"PM2.5",data:data.map(v=>v-20),borderColor:"#7c3aed",fill:false},
{label:"PM10",data:data.map(v=>v+10),borderColor:"#0ea5e9",fill:false}
]
},
options:{responsive:true}
});
}

function analyze(){
fetch("/getAQI",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({city:city.value,condition:condition.value})
})
.then(res=>res.json())
.then(data=>{
aqi.innerText=data.today;
status.innerText=data.status;
updated.innerText="Updated: "+data.updated;

pm25.innerText=data.pm25+" µg/m³";
pm10.innerText=data.pm10+" µg/m³";
co.innerText=data.co+" ppm";
no2.innerText=data.no2+" ppb";

precautions.innerHTML="";
data.precautions.forEach(p=>{
precautions.innerHTML+=`<li>${p}</li>`;
});

hospitals.innerHTML="";
data.hospitals.forEach(h=>{
hospitals.innerHTML+=`<li><b>${h.hospital_name}</b><br>${h.address}</li>`;
});

createChart(data.trend);
});
}
</script>

</body>
</html>
