<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Air Quality Monitoring System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Segoe UI;background:#f3f4f6;margin:0}
.header{background:#fff;padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;margin-bottom:20px;border-radius:10px;border:1px solid #e5e7eb}
.grid{display:grid;gap:20px}
.grid2{grid-template-columns:2fr 1fr}
.grid4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.aqi-value{font-size:60px;font-weight:bold}
.badge{padding:6px 12px;border-radius:20px;font-size:14px}
.good{background:#d1fae5;color:#065f46}
.moderate{background:#fef3c7;color:#92400e}
.poor{background:#fee2e2;color:#7f1d1d}
button{padding:8px 12px;background:#2563eb;color:white;border:none;border-radius:6px}
select{padding:6px}
</style>
</head>
<body>

<div class="header">
<div>
<h2>Air Quality Monitoring System</h2>
<small>Real-time environmental monitoring</small>
</div>
<small id="updated"></small>
</div>

<div class="container">

<div class="card">
<select id="city"></select>
<select id="condition">
<option>Asthma</option>
<option>COPD</option>
<option>Bronchitis</option>
<option>Allergic Rhinitis</option>
</select>
<button onclick="analyze()">Analyze</button>
</div>

<div class="grid grid2">
<div class="card">
<h3>AQI</h3>
<div id="aqi" class="aqi-value">--</div>
<div id="status" class="badge">--</div>
<p id="suitability"></p>
</div>

<div class="card">
<h3>Weather</h3>
<p>Temp: <b id="temp"></b>°C</p>
<p>Humidity: <b id="humidity"></b>%</p>
<p>Wind: <b id="wind"></b> km/h</p>
<p>Condition: <b id="conditionWeather"></b></p>
</div>
</div>

<div class="grid grid4">
<div class="card"><h4>PM2.5</h4><p id="pm25"></p></div>
<div class="card"><h4>PM10</h4><p id="pm10"></p></div>
<div class="card"><h4>CO</h4><p id="co"></p></div>
<div class="card"><h4>NO2</h4><p id="no2"></p></div>
</div>

<div class="card">
<h3>Hospitals</h3>
<ul id="hospitals"></ul>
</div>

<div class="card">
<h3>Precautions</h3>
<ul id="precautions"></ul>
</div>

</div>

<script>
const districts = [
"Bagalkote","Ballari","Belagavi","Bengaluru Urban","Bengaluru Rural",
"Bidar","Chamarajanagar","Chikkaballapura","Chikkamagaluru",
"Chitradurga","Dakshina Kannada","Davanagere","Dharwad","Gadag",
"Hassan","Haveri","Kalaburagi","Kodagu","Kolar","Koppal","Mandya",
"Mysuru","Raichur","Ramanagara","Shivamogga","Tumakuru","Udupi",
"Uttara Kannada","Vijayanagara","Vijayapura","Yadgir"
];

districts.forEach(d=>{
let opt=document.createElement("option");
opt.text=d;
city.add(opt);
});

function analyze(){
fetch("/getAQI",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({city:city.value,condition:condition.value})
})
.then(res=>res.json())
.then(data=>{
aqi.innerText=data.today;
status.innerText=data.status;
status.className="badge "+data.level;
suitability.innerText=data.suitability;

pm25.innerText=data.pm25+" µg/m³";
pm10.innerText=data.pm10+" µg/m³";
co.innerText=data.co+" ppm";
no2.innerText=data.no2+" ppb";

temp.innerText=data.temp;
humidity.innerText=data.humidity;
wind.innerText=data.wind;
conditionWeather.innerText=data.conditionWeather;

updated.innerText="Last Updated: "+data.updated;

hospitals.innerHTML="";
data.hospitals.forEach(h=>{
hospitals.innerHTML+=`<li><b>${h.hospital_name}</b><br>${h.address}</li>`;
});

precautions.innerHTML="";
data.precautions.forEach(p=>{
precautions.innerHTML+=`<li>${p}</li>`;
});
});
}
</script>

</body>
</html>
